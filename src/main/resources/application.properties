spring.application.name=api-gateway
server.port=${PORT:8080}

# URLs de los microservicios (override en Render con env vars)
gateway.dye-url=${DYE_URL:https://donadores-entidades.onrender.com}
gateway.donaciones-url=${DONACIONES_URL:https://donaciones-dgs7.onrender.com}
gateway.logistica-url=${LOGISTICA_URL:https://logisticaweb.onrender.com}
gateway.incentivos-url=${INCENTIVOS_URL:https://incentivos-movn.onrender.com}

# Rate limit por IP (in-memory). Desactivar con RATE_LIMIT_ENABLED=false
gateway.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
gateway.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:120}

# CORS — * permite cualquier origen (útil para bot local). En prod: lista separada por coma
gateway.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Timeout por backend en GET /health (segundos). Render free tier cold start ~30-60s
gateway.health-backend-timeout-sec=${HEALTH_BACKEND_TIMEOUT_SEC:45}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.datadog.metrics.export.enabled=false

# Gateway HTTP client timeouts hacia backends
spring.cloud.gateway.httpclient.connect-timeout=10000
spring.cloud.gateway.httpclient.response-timeout=60s

# Logging
logging.level.org.springframework.cloud.gateway=INFO
logging.level.ar.edu.utn.dds.k3003=INFO
