<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DonaTrack — Ingresar</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%92%3C/text%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #0b0f17;
        --bg-elev: #121826;
        --bg-elev-2: #182034;
        --border: #232c42;
        --text: #e6edf7;
        --text-dim: #9aa5bd;
        --text-muted: #6b7691;
        --accent: #6aa9ff;
        --accent-strong: #4d8cff;
        --up: #22c55e;
        --down: #ef4444;
        --down-bg: rgba(239, 68, 68, 0.14);
        --down-border: rgba(239, 68, 68, 0.35);
        --shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        --radius: 14px;
        --radius-sm: 10px;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f5f7fb;
          --bg-elev: #ffffff;
          --bg-elev-2: #f0f3f9;
          --border: #e2e8f0;
          --text: #0f172a;
          --text-dim: #475569;
          --text-muted: #64748b;
          --down-bg: rgba(239, 68, 68, 0.10);
          --shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
        }
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(77, 140, 255, 0.18), transparent 60%),
          radial-gradient(900px 500px at 100% 10%, rgba(34, 197, 94, 0.10), transparent 60%),
          var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 32px 28px;
        box-shadow: var(--shadow);
        width: 100%;
        max-width: 400px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }

      .logo {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent) 0%, #a78bfa 100%);
        display: grid;
        place-items: center;
        font-size: 20px;
        box-shadow: 0 8px 20px rgba(77, 140, 255, 0.35);
      }

      h1 {
        margin: 0;
        font-size: 20px;
        letter-spacing: -0.01em;
      }

      .subtitle {
        color: var(--text-dim);
        font-size: 12.5px;
        margin-top: 2px;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12.5px;
        color: var(--text-dim);
      }

      input[type="password"] {
        background: var(--bg-elev-2);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 12px 14px;
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      input[type="password"]:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(106, 169, 255, 0.18);
      }

      button {
        background: var(--accent-strong);
        color: white;
        border: none;
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.05s ease;
        margin-top: 4px;
        font-family: inherit;
      }

      button:hover {
        background: #3b7bff;
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      button:active {
        transform: translateY(1px);
      }

      .error {
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        background: var(--down-bg);
        border: 1px solid var(--down-border);
        color: var(--down);
        font-size: 12.5px;
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }

      .error[hidden] { display: none; }

      .hint {
        color: var(--text-muted);
        font-size: 11.5px;
        line-height: 1.55;
        margin-top: 12px;
        text-align: center;
      }

      .hint code {
        background: var(--bg-elev-2);
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <div class="logo" aria-hidden="true">◈</div>
        <div>
          <h1>DonaTrack — Ingresar</h1>
          <div class="subtitle">Dashboard operativo de la entrega</div>
        </div>
      </div>

      <div class="error" id="errorMsg" {{ERROR_ATTR}}>
        <span aria-hidden="true">✖</span>
        <span>Contraseña incorrecta. Verificá el valor de <code>ADMIN_SECRET</code>.</span>
      </div>

      <form method="post" action="/admin/login" autocomplete="off">
        <label for="password">
          Contraseña administrativa
          <input
            type="password"
            id="password"
            name="password"
            required
            autofocus
            spellcheck="false"
            placeholder="ADMIN_SECRET"
          />
        </label>
        <button type="submit">Ingresar</button>
      </form>

      <p class="hint">
        La contraseña coincide con la env var <code>ADMIN_SECRET</code> del api-gateway.
        La sesión dura hasta que cierres el browser.
      </p>
    </main>
  </body>
</html>
